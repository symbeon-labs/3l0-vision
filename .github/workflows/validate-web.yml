name: Validate 3L0 Vision

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "server/**"
      - "tests/**"
      - "docs/**"
      - "index.html"
      - "package.json"
      - ".github/workflows/validate-web.yml"
  push:
    branches:
      - feat/first-usable-interface
      - feat/gate-1-api-backend
    paths:
      - "app/**"
      - "core/**"
      - "server/**"
      - "tests/**"
      - "docs/**"
      - "index.html"
      - "package.json"
      - ".github/workflows/validate-web.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build web app
        run: npm run build
